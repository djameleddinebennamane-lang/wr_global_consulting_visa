<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1426">
<meta name="description" content="WR Global Consulting Visa — bureau de conseil et de services pour vos projets de voyage et de visa.">
<title>WR Global Consulting Visa</title>

<style>
:root {
  --navy:#0b1426;
  --deep:#101d32;
  --gold:#c9ad78;
  --light:#f1e8d8;
  --muted:#aeb8c7;
  --line:#c9ad7850;
}

* {box-sizing:border-box}

html {scroll-behavior:smooth}

body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at 50% 30%,#1b2c46 0%,#101d32 48%,#080f1d 100%);
  color:var(--light);
  font-family:Georgia,"Times New Roman",serif;
}

header {
  min-height:82px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #c9ad783b;
}

.brand {
  color:var(--gold);
  font-size:25px;
  letter-spacing:4px;
}

.brand small {
  display:block;
  font:10px Arial,sans-serif;
  letter-spacing:3px;
  margin-top:5px;
}

button,a {cursor:pointer;font:inherit}

.lang {
  background:transparent;
  color:var(--gold);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:9px 17px;
}

nav {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  padding:18px 5%;
  border-bottom:1px solid #c9ad7830;
}

nav button {
  background:transparent;
  border:1px solid transparent;
  color:var(--light);
  padding:12px 19px;
  transition:.2s;
}

nav button:hover,
nav button.active {
  color:var(--gold);
  border-color:#c9ad7870;
}

main {
  width:min(1050px,90%);
  margin:auto;
  padding:45px 0;
}

.section {
  display:none;
  animation:appear .35s ease;
}

.section.active {display:block}

@keyframes appear {
  from {opacity:0;transform:translateY(8px)}
  to {opacity:1;transform:translateY(0)}
}

.hero {
  text-align:center;
  padding:55px 15px 65px;
}

.eyebrow {
  color:var(--gold);
  font:11px Arial,sans-serif;
  letter-spacing:4px;
  margin-bottom:20px;
}

h1 {
  font-size:clamp(28px,5vw,48px);
  font-weight:normal;
  letter-spacing:2px;
  margin:0;
}

.subtitle {
  color:var(--muted);
  font:12px Arial,sans-serif;
  letter-spacing:2px;
  margin:20px 0;
}

.hero-description {
  max-width:680px;
  margin:25px auto;
  line-height:1.9;
  color:var(--light);
  font-size:17px;
}

.signature {
  color:var(--gold);
  text-align:center;
  margin:35px auto 15px;
  font-style:italic;
  line-height:1.8;
}

.section h2 {
  color:var(--gold);
  font-weight:normal;
  font-size:30px;
  text-align:center;
  margin:12px 0 20px;
}

.intro {
  color:var(--muted);
  text-align:center;
  line-height:1.9;
  max-width:750px;
  margin:0 auto 35px;
}

.values {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:35px;
}

.value {
  text-align:center;
  border-top:1px solid var(--gold);
  padding:15px 10px;
}

.value h3,
.card h3,
.contact-item h3 {
  color:var(--gold);
  font-weight:normal;
}

.cards {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card {
  background:#ffffff08;
  border:1px solid var(--line);
  padding:22px 19px;
  min-height:205px;
  transition:.25s;
  display:flex;
  flex-direction:column;
}

.card:hover {
  border-color:var(--gold);
  background:#c9ad7810;
  transform:translateY(-3px);
}

.card h3 {
  font-size:19px;
  margin:0 0 10px;
}

.card p {
  color:var(--muted);
  font-size:14px;
  line-height:1.8;
  margin:0 0 18px;
}

.service-actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:auto;
}

.service-actions a,
.contact-link {
  display:inline-block;
  text-decoration:none;
  color:var(--gold);
  border:1px solid #c9ad7870;
  border-radius:18px;
  padding:7px 10px;
  font:11px Arial,sans-serif;
  transition:.2s;
}

.service-actions a:hover,
.contact-link:hover {
  background:#c9ad7818;
  border-color:var(--gold);
}

.contact-info {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.contact-item {
  padding:20px;
  border:1px solid var(--line);
  background:#ffffff08;
}

.contact-item p {
  color:var(--muted);
  line-height:1.7;
  overflow-wrap:anywhere;
}

.contact-actions {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

footer {
  text-align:center;
  color:#9da8b8;
  font:10px Arial,sans-serif;
  letter-spacing:2px;
  padding:25px 10px;
  border-top:1px solid #c9ad7830;
}

[dir="rtl"] {
  font-family:Tahoma,Arial,sans-serif;
}

[dir="rtl"] .eyebrow,
[dir="rtl"] .subtitle {
  letter-spacing:1px;
}

[dir="rtl"] .brand {
  letter-spacing:1px;
}

[dir="rtl"] .service-actions,
[dir="rtl"] .contact-actions {
  justify-content:flex-start;
}

a:focus-visible,
button:focus-visible {
  outline:2px solid var(--gold);
  outline-offset:3px;
}

@media(max-width:650px) {
  header {min-height:70px;padding:0 5%}
  .brand {font-size:20px;letter-spacing:2px}
  nav {gap:3px;padding:12px 3%}
  nav button {padding:10px;font-size:13px}
  main {padding:30px 0}
  .hero {padding:40px 10px}
  .cards {grid-template-columns:repeat(2,1fr);gap:10px}
  .card {padding:16px 12px}
  .card h3 {font-size:16px}
  .card p {font-size:13px}
  .values {grid-template-columns:1fr}
  .contact-info {grid-template-columns:1fr}
}

@media(max-width:360px) {
  .cards {grid-template-columns:1fr}
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none !important;
    transition:none !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    WR GLOBAL
    <small>CONSULTING VISA</small>
  </div>
  <button class="lang" id="language" type="button">العربية</button>
</header>

<nav id="navigation" aria-label="Navigation principale">
  <button data-page="home" class="active" type="button">Accueil</button>
  <button data-page="about" type="button">À propos</button>
  <button data-page="services" type="button">Conseil &amp; Services</button>
  <button data-page="contact" type="button">Contact</button>
</nav>

<main>

<section id="home" class="section active">
  <div class="hero">
    <p class="eyebrow" id="hero-label"></p>
    <h1 id="heading"></h1>
    <p class="subtitle" id="subtitle"></p>
    <p class="hero-description" id="hero-text"></p>
  </div>
  <div class="signature" id="signature"></div>
</section>

<section id="about" class="section">
  <h2 id="about-title"></h2>
  <p class="intro" id="about-intro"></p>
  <div class="values" id="values"></div>
</section>

<section id="services" class="section">
  <h2 id="services-title"></h2>
  <p class="intro" id="services-intro"></p>
  <div class="cards" id="service-cards"></div>
</section>

<section id="contact" class="section">
  <h2 id="contact-title"></h2>
  <p class="intro" id="contact-intro"></p>
  <div class="contact-info" id="contact-info"></div>
</section>

</main>

<footer id="footer"></footer>

<script>
const CONTACT = {
  phoneDisplay: "À RENSEIGNER",
  phoneLink: "",
  whatsapp: "",
  email: ""
};

const translations = {

fr: {
  toggle:"العربية",

  nav:["Accueil","À propos","Conseil & Services","Contact"],

  heroLabel:"CONSEIL · ACCOMPAGNEMENT · ASSISTANCE",
  heading:"WR GLOBAL CONSULTING VISA",
  subtitle:"BUREAU DE CONSEIL ET DE SERVICES",

  heroText:"Nous préparons chaque étape de votre départ avec rigueur et discrétion.",

  signature:"Votre partenaire de confiance pour vos projets à l'international",

  aboutTitle:"À propos de WR Global Consulting Visa",

  aboutIntro:"Établi à Ouled Belhadj, Saoula, WR Global Consulting Visa est un bureau de conseil et de services qui accompagne les particuliers, les familles et les professionnels dans leurs projets de voyage et leurs démarches de visa. Notre approche repose sur l'écoute, la préparation rigoureuse et un accompagnement adapté à chaque projet.",

  values:[
    ["Écoute","Prendre le temps de comprendre votre projet et vos besoins."],
    ["Rigueur","Préparer et vérifier attentivement les éléments de votre dossier."],
    ["Accompagnement","Vous guider à chaque étape de vos démarches."]
  ],

  servicesTitle:"Conseil & Services",

  servicesIntro:"Découvrez nos six domaines de services pour préparer vos démarches de voyage et de visa.",

  actionWhatsapp:"WhatsApp",
  actionPhone:"Appeler",
  actionEmail:"E-mail",

  services:[
    ["RDV Visa","Prise de rendez-vous auprès des centres de dépôt et accompagnement jusqu'au jour de votre rendez-vous."],
    ["Formulaires","Remplissage soigné de vos formulaires de demande de visa, vérifiés avant chaque dépôt."],
    ["Réservation Hôtel","Réservations d'hôtel adaptées à votre séjour et aux exigences de votre dossier."],
    ["Billets d'Avion","Recherche et émission de billets d'avion selon vos dates et votre destination."],
    ["Assurance Voyage","Souscription d'une assurance voyage conforme aux exigences de votre demande."],
    ["Visa Électronique","Constitution et suivi de vos demandes de visa électronique, en ligne et sans déplacement."]
  ],

  contactTitle:"Contact",

  contactIntro:"Notre bureau vous accueille à Saoula pour échanger sur vos projets et étudier vos besoins.",

  contact:[
    ["Responsable","Ryan — Directeur général"],
    ["Adresse","Ouled Belhadj, Saoula, Alger, Algérie"],
    ["Téléphone",CONTACT.phoneDisplay],
    ["E-mail",CONTACT.email || "À renseigner"]
  ],

  footer:"WR GLOBAL CONSULTING VISA · TOUS DROITS RÉSERVÉS"
},

ar: {
  toggle:"Français",

  nav:["الرئيسية","من نحن","الاستشارة والخدمات","اتصل بنا"],

  heroLabel:"استشارة · مرافقة · مساعدة",
  heading:"WR GLOBAL CONSULTING VISA",
  subtitle:"مكتب للاستشارة والخدمات",

  heroText:"نحضّر كل مرحلة من سفركم بدقة وسرية.",

  signature:"شريككم الموثوق لمشاريعكم على الصعيد الدولي",

  aboutTitle:"من نحن",

  aboutIntro:"من مقرنا بأولاد بلحاج، السحاولة، يُعدّ WR Global Consulting Visa مكتباً للاستشارة والخدمات، يرافق الأفراد والعائلات والمهنيين في مشاريع السفر وإجراءات التأشيرة. يعتمد نهجنا على الإصغاء والتحضير الدقيق والمرافقة المناسبة لكل مشروع.",

  values:[
    ["الإصغاء","نخصص الوقت لفهم مشروعكم واحتياجاتكم."],
    ["الدقة","نحرص على تحضير عناصر ملفكم ومراجعتها بعناية."],
    ["المرافقة","نرشدكم في كل مرحلة من مراحل إجراءاتكم."]
  ],

  servicesTitle:"الاستشارة والخدمات",

  servicesIntro:"اكتشفوا مجالات خدماتنا الستة لتحضير إجراءات السفر والتأشيرة.",

  actionWhatsapp:"واتساب",
  actionPhone:"اتصال",
  actionEmail:"البريد",

  services:[
    ["موعد التأشيرة","حجز موعدكم لدى مراكز إيداع الملفات ومرافقتكم حتى يوم الموعد."],
    ["الاستمارات","ملء استمارات طلب التأشيرة بعناية ومراجعتها قبل كل إيداع."],
    ["حجز الفنادق","حجوزات فندقية تتناسب مع إقامتكم ومع متطلبات ملفكم."],
    ["تذاكر الطيران","البحث عن تذاكر الطيران وإصدارها حسب تواريخكم ووجهتكم."],
    ["تأمين السفر","اكتتاب تأمين سفر مطابق لمتطلبات طلبكم."],
    ["التأشيرة الإلكترونية","إعداد طلبات التأشيرة الإلكترونية ومتابعتها عبر الإنترنت دون عناء التنقل."]
  ],

  contactTitle:"اتصلوا بنا",

  contactIntro:"يسعدنا استقبالكم بمكتبنا في السحاولة للتحدث عن مشاريعكم ودراسة احتياجاتكم.",

  contact:[
    ["المسؤول","Ryan — المدير العام"],
    ["العنوان","أولاد بلحاج، السحاولة، الجزائر العاصمة، الجزائر"],
    ["الهاتف",CONTACT.phoneDisplay],
    ["البريد الإلكتروني",CONTACT.email || "يُحدد لاحقاً"]
  ],

  footer:"WR GLOBAL CONSULTING VISA · جميع الحقوق محفوظة"
}

};

let lang="fr";

function whatsappUrl(serviceName) {
  if (!CONTACT.whatsapp) return "#contact";

  const message = lang==="fr"
    ? `Bonjour WR Global Consulting Visa, je souhaite des informations sur le service : ${serviceName}.`
    : `مرحباً WR Global Consulting Visa، أود الحصول على معلومات حول خدمة: ${serviceName}.`;

  return `https://wa.me/${CONTACT.whatsapp}?text=${encodeURIComponent(message)}`;
}

function render() {

  const t=translations[lang];

  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";

  document.getElementById("language").textContent=t.toggle;

  document.querySelectorAll("#navigation button").forEach((b,i)=>{
    b.textContent=t.nav[i];
  });

  document.getElementById("hero-label").textContent=t.heroLabel;
  document.getElementById("heading").textContent=t.heading;
  document.getElementById("subtitle").textContent=t.subtitle;
  document.getElementById("hero-text").textContent=t.heroText;
  document.getElementById("signature").textContent=t.signature;

  document.getElementById("about-title").textContent=t.aboutTitle;
  document.getElementById("about-intro").textContent=t.aboutIntro;

  document.getElementById("values").innerHTML=
    t.values.map(v=>`
      <article class="value">
        <h3>${v[0]}</h3>
        <p>${v[1]}</p>
      </article>
    `).join("");

  document.getElementById("services-title").textContent=t.servicesTitle;
  document.getElementById("services-intro").textContent=t.servicesIntro;

  document.getElementById("service-cards").innerHTML=
    t.services.map(s=>`
      <article class="card">
        <h3>${s[0]}</h3>
        <p>${s[1]}</p>
        <div class="service-actions">
          <a href="${whatsappUrl(s[0])}" target="_blank" rel="noopener noreferrer">${t.actionWhatsapp}</a>
          <a href="${CONTACT.phoneLink ? "tel:"+CONTACT.phoneLink : "#contact"}">${t.actionPhone}</a>
          <a href="${CONTACT.email ? "mailto:"+CONTACT.email : "#contact"}">${t.actionEmail}</a>
        </div>
      </article>
    `).join("");

  document.getElementById("contact-title").textContent=t.contactTitle;
  document.getElementById("contact-intro").textContent=t.contactIntro;

  document.getElementById("contact-info").innerHTML=
    t.contact.map(c=>`
      <article class="contact-item">
        <h3>${c[0]}</h3>
        <p>${c[1]}</p>
      </article>
    `).join("");

  document.getElementById("footer").textContent=t.footer;
}

document.getElementById("language").onclick=()=>{
  lang=lang==="fr"?"ar":"fr";
  render();
};

document.querySelectorAll("#navigation button").forEach(button=>{
  button.onclick=()=>{
    const page=button.dataset.page;

    document.querySelectorAll(".section").forEach(section=>{
      section.classList.remove("active");
    });

    document.getElementById(page).classList.add("active");

    document.querySelectorAll("#navigation button").forEach(b=>{
      b.classList.remove("active");
    });

    button.classList.add("active");

    window.scrollTo({top:0,behavior:"smooth"});
  };
});

render();
</script>

</body>
</html>
