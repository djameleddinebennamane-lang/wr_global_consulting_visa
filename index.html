
<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07101f">
<meta name="description" content="WR Global Consulting Visa — bureau de conseil et de services pour vos projets de voyage et de visa.">
<title>WR Global Consulting Visa</title>

<style>
:root {
  --navy:#07101f;
  --deep:#0a1529;
  --gold:#f0cf83;
  --gold-light:#fff0bd;
  --light:#ffffff;
  --muted:#ffffff;
  --line:#eac67580;
}

* {box-sizing:border-box}

html {scroll-behavior:smooth}

body {
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 25%,#172b49 0%,#0a1529 48%,#050b16 100%);
  color:var(--light);
  font-family:Georgia,"Times New Roman",serif;
}

header {
  min-height:82px;
  padding:10px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  width:100%;
  overflow:hidden;
}

.brand {
  display:flex;
  align-items:center;
  flex:1;
  min-width:0;
}

.brand img {
  display:block;
  width:auto;
  max-width:100%;
  height:auto;
  max-height:60px;
  object-fit:contain;
}

.lang {
  flex-shrink:0;
}

.lang span {opacity:.65}
.lang span.active {
  opacity:1;
  color:var(--gold-light);
  font-weight:bold;
}

.lang .separator {color:var(--gold)}

nav {
  overflow:hidden;
  width:100%;
  padding:16px 0;
  border-bottom:1px solid #eac67545;
  background:#09142680;
}

.nav-track {
  display:flex;
  width:max-content;
  animation:nav-marquee 24s linear infinite;
}

.nav-group {
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 7px;
}

nav:hover .nav-track {
  animation-play-state:paused;
}

nav button {
  flex-shrink:0;
  background:#ffffff08;
  border:1px solid #eac67570;
  border-radius:12px;
  color:white;
  padding:12px 25px;
  white-space:nowrap;
  transition:.25s;
}

nav button:hover,
nav button.active {
  color:var(--gold-light);
  border-color:var(--gold);
  background:#eac67518;
  box-shadow:0 0 13px #eac67530;
}

@keyframes nav-marquee {
  from {transform:translateX(0)}
  to {transform:translateX(-50%)}
}

main {
  width:min(1050px,90%);
  margin:auto;
  padding:45px 0;
}

.section {
  display:none;
  animation:appear .35s ease;
}

.section.active {display:block}

@keyframes appear {
  from {opacity:0;transform:translateY(8px)}
  to {opacity:1;transform:translateY(0)}
}

.hero {
  text-align:center;
  padding:55px 15px 45px;
}

.eyebrow {display:none}

h1 {
  font-size:clamp(28px,5vw,48px);
  font-weight:normal;
  letter-spacing:2px;
  margin:0;
  color:var(--gold-light);
  text-shadow:0 0 16px #eac67555;
}

.subtitle {
  color:white;
  font:12px Arial,sans-serif;
  letter-spacing:2px;
  margin:20px 0;
}

.hero-description {
  max-width:680px;
  margin:25px auto;
  line-height:1.9;
  color:white;
  font-size:17px;
}

.signature {
  color:var(--gold-light);
  text-align:center;
  margin:22px auto 15px;
  font-style:italic;
  line-height:1.8;
}

.section h2 {
  color:var(--gold-light);
  font-weight:normal;
  font-size:30px;
  text-align:center;
  margin:12px 0 20px;
}

.intro {
  color:white;
  text-align:center;
  line-height:1.9;
  max-width:750px;
  margin:0 auto 35px;
}

.values {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:35px;
}

.value {
  text-align:center;
  border-top:1px solid var(--gold);
  padding:15px 10px;
}

.value h3,
.card h3,
.contact-item h3 {
  color:var(--gold-light);
  font-weight:normal;
}

.value p {
  color:white;
  line-height:1.8;
}

.cards {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card {
  background:#ffffff09;
  border:1px solid var(--line);
  border-radius:12px;
  padding:22px 19px;
  min-height:205px;
  transition:.25s;
  display:flex;
  flex-direction:column;
}

.card:hover {
  border-color:var(--gold-light);
  background:#eac67515;
  transform:translateY(-3px);
  box-shadow:0 0 15px #eac67520;
}

.card h3 {
  font-size:19px;
  margin:0 0 10px;
}

.card p {
  color:white;
  font-size:14px;
  line-height:1.8;
  margin:0 0 18px;
}

.service-actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:auto;
}

.service-actions a,
.contact-link {
  display:inline-block;
  text-decoration:none;
  color:var(--gold-light);
  border:1px solid #eac67590;
  border-radius:18px;
  padding:7px 10px;
  font:11px Arial,sans-serif;
  transition:.2s;
}

.service-actions a:hover,
.contact-link:hover {
  background:#eac67520;
  border-color:var(--gold-light);
}

.contact-info {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.contact-item {
  padding:20px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#ffffff09;
}

.contact-item p {
  color:white;
  line-height:1.7;
  overflow-wrap:anywhere;
}

.contact-actions {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  margin:30px auto;
}

.contact-icon {
  display:flex;
  align-items:center;
  gap:9px;
  text-decoration:none;
  color:white;
  border:1px solid var(--gold);
  border-radius:25px;
  padding:11px 17px;
  background:#ffffff08;
  transition:.25s;
  font:13px Arial,sans-serif;
}

.contact-icon:hover {
  background:#eac67520;
  box-shadow:0 0 15px #eac67535;
  transform:translateY(-2px);
}

.contact-icon svg {
  width:21px;
  height:21px;
  fill:none;
  stroke:var(--gold-light);
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.contact-icon.whatsapp svg {
  fill:var(--gold-light);
  stroke:none;
}

footer {
  text-align:center;
  color:white;
  font:10px Arial,sans-serif;
  letter-spacing:2px;
  padding:25px 10px;
  border-top:1px solid #eac67545;
}

[dir="rtl"] {
  font-family:Tahoma,Arial,sans-serif;
}

[dir="rtl"] .eyebrow,
[dir="rtl"] .subtitle {
  letter-spacing:1px;
}

[dir="rtl"] .brand {
  letter-spacing:1px;
}

[dir="rtl"] .service-actions,
[dir="rtl"] .contact-actions {
  justify-content:center;
}

[dir="rtl"] .nav-track {
  animation-name:nav-marquee-rtl;
}

@keyframes nav-marquee-rtl {
  from {transform:translateX(-50%)}
  to {transform:translateX(0)}
}

a:focus-visible,
button:focus-visible {
  outline:2px solid var(--gold-light);
  outline-offset:3px;
}

@media(max-width:650px) {
  header {min-height:70px;padding:0 5%}
  .brand {font-size:20px;letter-spacing:2px}
  .lang {padding:8px 12px;font-size:11px}
  nav {padding:12px 0}
  nav button {padding:10px 17px;font-size:13px}
  .nav-track {animation-duration:20s}
  main {padding:30px 0}
  .hero {padding:40px 10px}
  .cards {grid-template-columns:repeat(2,1fr);gap:10px}
  .card {padding:16px 12px}
  .card h3 {font-size:16px}
  .card p {font-size:13px}
  .values {grid-template-columns:1fr}
  .contact-info {grid-template-columns:1fr}
}

@media(max-width:360px) {
  .cards {grid-template-columns:1fr}
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none !important;
    transition:none !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
  <img src="wr-global-consulting-visa-logo.png" alt="WR Global Consulting Visa">
</div>
  <button class="lang" id="language" type="button" aria-label="Changer de langue">
    <span id="arabic-label">عربي</span>
    <span class="separator">/</span>
    <span id="french-label" class="active">Français</span>
  </button>
</header>

<nav id="navigation" aria-label="Navigation principale">
  <div class="nav-track">
    <div class="nav-group" id="nav-original">
      <button data-page="home" class="active" type="button">Accueil</button>
      <button data-page="about" type="button">À propos</button>
      <button data-page="services" type="button">Conseil &amp; Services</button>
      <button data-page="contact" type="button">Contact</button>
    </div>
    <div class="nav-group" id="nav-copy" aria-hidden="true">
      <button data-page="home" class="active" type="button" tabindex="-1">Accueil</button>
      <button data-page="about" type="button" tabindex="-1">À propos</button>
      <button data-page="services" type="button" tabindex="-1">Conseil &amp; Services</button>
      <button data-page="contact" type="button" tabindex="-1">Contact</button>
    </div>
  </div>
</nav>

<main>

<section id="home" class="section active">
  <div class="hero">
    <h1 id="heading"></h1>
    <div class="signature" id="signature"></div>
    <p class="subtitle" id="subtitle"></p>
    <p class="hero-description" id="hero-text"></p>
  </div>
</section>

<section id="about" class="section">
  <h2 id="about-title"></h2>
  <p class="intro" id="about-intro"></p>
  <div class="values" id="values"></div>
</section>

<section id="services" class="section">
  <h2 id="services-title"></h2>
  <p class="intro" id="services-intro"></p>
  <div class="cards" id="service-cards"></div>
</section>

<section id="contact" class="section">
  <h2 id="contact-title"></h2>
  <p class="intro" id="contact-intro"></p>
  <div class="contact-info" id="contact-info"></div>
  <div class="contact-actions" id="contact-actions"></div>
</section>

</main>

<footer id="footer"></footer>

<script>
const CONTACT = {
  phoneDisplay: "0770 12 61 44",
  phoneLink: "+213770126144",
  whatsapp: "213770126144",
  email: "wr.consultingvisa@gmail.com"
};

const translations = {

fr: {
  toggle:"العربية",

  nav:["Accueil","À propos","Conseil & Services","Contact"],

  heading:"WR GLOBAL CONSULTING VISA",

  subtitle:"BUREAU DE CONSEIL ET DE SERVICES",

  heroText:"Nous préparons chaque étape de votre départ avec rigueur et discrétion.",

  signature:"Votre partenaire de confiance pour vos projets à l'international",

  aboutTitle:"À propos de WR Global Consulting Visa",

  aboutIntro:"Établi à Ouled Belhadj, Saoula, Alger, WR Global Consulting Visa est un bureau de conseil et de services qui accompagne les particuliers, les familles et les professionnels dans leurs projets de voyage et leurs démarches de visa. Notre approche repose sur l'écoute, la préparation rigoureuse et un accompagnement adapté à chaque projet.",

  values:[
    ["Écoute","Prendre le temps de comprendre votre projet et vos besoins."],
    ["Rigueur","Préparer et vérifier attentivement les éléments de votre dossier."],
    ["Accompagnement","Vous guider à chaque étape de vos démarches."]
  ],

  servicesTitle:"Conseil & Services",

  servicesIntro:"Découvrez nos six domaines de services pour préparer vos démarches de voyage et de visa.",

  actionWhatsapp:"WhatsApp",
  actionPhone:"Appeler",
  actionEmail:"E-mail",

  services:[
    ["RDV Visa","Prise de rendez-vous auprès des centres de dépôt et accompagnement jusqu'au jour de votre rendez-vous."],
    ["Formulaires","Remplissage soigné de vos formulaires de demande de visa, vérifiés avant chaque dépôt."],
    ["Réservation Hôtel","Réservations d'hôtel adaptées à votre séjour et aux exigences de votre dossier."],
    ["Billets d'Avion","Recherche et émission de billets d'avion selon vos dates et votre destination."],
    ["Assurance Voyage","Souscription d'une assurance voyage conforme aux exigences de votre demande."],
    ["Visa Électronique","Constitution et suivi de vos demandes de visa électronique, en ligne et sans déplacement."]
  ],

  contactTitle:"Contact",

  contactIntro:"Notre bureau vous accueille à Saoula pour échanger sur vos projets et étudier vos besoins.",

  contact:[
    ["Responsable","Wassim Ryan Boudjellab — Directeur général"],
    ["Adresse","Ouled Belhadj, Saoula, Alger, Algérie"],
    ["Téléphone",CONTACT.phoneDisplay],
    ["E-mail",CONTACT.email]
  ],

  contactCall:"Appeler",
  contactMail:"Envoyer un e-mail",
  contactWhatsApp:"Contacter sur WhatsApp",

  footer:"WR GLOBAL CONSULTING VISA · TOUS DROITS RÉSERVÉS"
},

ar: {
  toggle:"Français",

  nav:["الرئيسية","من نحن","الاستشارة والخدمات","اتصل بنا"],

  heading:"WR GLOBAL CONSULTING VISA",

  subtitle:"مكتب للاستشارة والخدمات",

  heroText:"نحضّر كل مرحلة من سفركم بدقة وسرية.",

  signature:"شريككم الموثوق لمشاريعكم على الصعيد الدولي",

  aboutTitle:"من نحن",

  aboutIntro:"من مقرنا بأولاد بلحاج، السحاولة، الجزائر العاصمة، يُعدّ WR Global Consulting Visa مكتباً للاستشارة والخدمات، يرافق الأفراد والعائلات والمهنيين في مشاريع السفر وإجراءات التأشيرة. يعتمد نهجنا على الإصغاء والتحضير الدقيق والمرافقة المناسبة لكل مشروع.",

  values:[
    ["الإصغاء","نخصص الوقت لفهم مشروعكم واحتياجاتكم."],
    ["الدقة","نحرص على تحضير عناصر ملفكم ومراجعتها بعناية."],
    ["المرافقة","نرشدكم في كل مرحلة من مراحل إجراءاتكم."]
  ],

  servicesTitle:"الاستشارة والخدمات",

  servicesIntro:"اكتشفوا مجالات خدماتنا الستة لتحضير إجراءات السفر والتأشيرة.",

  actionWhatsapp:"واتساب",
  actionPhone:"اتصال",
  actionEmail:"البريد",

  services:[
    ["موعد التأشيرة","حجز موعدكم لدى مراكز إيداع الملفات ومرافقتكم حتى يوم الموعد."],
    ["الاستمارات","ملء استمارات طلب التأشيرة بعناية ومراجعتها قبل كل إيداع."],
    ["حجز الفنادق","حجوزات فندقية تتناسب مع إقامتكم ومع متطلبات ملفكم."],
    ["تذاكر الطيران","البحث عن تذاكر الطيران وإصدارها حسب تواريخكم ووجهتكم."],
    ["تأمين السفر","اكتتاب تأمين سفر مطابق لمتطلبات طلبكم."],
    ["التأشيرة الإلكترونية","إعداد طلبات التأشيرة الإلكترونية ومتابعتها عبر الإنترنت دون عناء التنقل."]
  ],

  contactTitle:"اتصلوا بنا",

  contactIntro:"يسعدنا استقبالكم بمكتبنا في السحاولة للتحدث عن مشاريعكم ودراسة احتياجاتكم.",

  contact:[
    ["المسؤول","Wassim Ryan Boudjellab — المدير العام"],
    ["العنوان","أولاد بلحاج، السحاولة، الجزائر العاصمة، الجزائر"],
    ["الهاتف",CONTACT.phoneDisplay],
    ["البريد الإلكتروني",CONTACT.email]
  ],

  contactCall:"اتصال",
  contactMail:"إرسال بريد إلكتروني",
  contactWhatsApp:"التواصل عبر واتساب",

  footer:"WR GLOBAL CONSULTING VISA · جميع الحقوق محفوظة"
}

};

let lang="fr";

function whatsappUrl(serviceName) {
  const message = lang==="fr"
    ? `Bonjour WR Global Consulting Visa, je souhaite des informations sur le service : ${serviceName}.`
    : `مرحباً WR Global Consulting Visa، أود الحصول على معلومات حول خدمة: ${serviceName}.`;

  return `https://wa.me/${CONTACT.whatsapp}?text=${encodeURIComponent(message)}`;
}

const icons = {
  phone: `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 11.2 18a19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 3.2 2 2 0 0 1 4.1 1h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/>
    </svg>`,

  email: `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="m22 7-10 7L2 7"/>
    </svg>`,

  whatsapp: `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 3.5A11.8 11.8 0 0 0 2 17.8L.5 23.5l5.8-1.5A11.8 11.8 0 1 0 20.5 3.5ZM12 21a9 9 0 0 1-4.6-1.3l-.3-.2-3.4.9.9-3.3-.2-.4A9 9 0 1 1 12 21Zm5-6.7c-.3-.2-1.7-.9-2-.9s-.5-.2-.7.2-.8.9-.9 1.1-.3.2-.6.1a7.3 7.3 0 0 1-2.2-1.4 8.2 8.2 0 0 1-1.5-1.9c-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5s0-.4 0-.5-.7-1.7-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4s-1 1-1 2.3 1 2.6 1.1 2.8c.1.2 2 3.1 4.9 4.3 1.8.8 2.5.9 3.4.8.5-.1 1.7-.7 1.9-1.4s.2-1.3.2-1.4-.2-.3-.5-.5Z"/>
    </svg>`
};

function render() {

  const t=translations[lang];

  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";

  document.getElementById("arabic-label").classList.toggle("active",lang==="ar");
  document.getElementById("french-label").classList.toggle("active",lang==="fr");

  document.querySelectorAll("#navigation button").forEach((b,i)=>{
    b.textContent=t.nav[i%4];
  });

  document.getElementById("heading").textContent=t.heading;
  document.getElementById("subtitle").textContent=t.subtitle;
  document.getElementById("hero-text").textContent=t.heroText;
  document.getElementById("signature").textContent=t.signature;

  document.getElementById("about-title").textContent=t.aboutTitle;
  document.getElementById("about-intro").textContent=t.aboutIntro;

  document.getElementById("values").innerHTML=
    t.values.map(v=>`
      <article class="value">
        <h3>${v[0]}</h3>
        <p>${v[1]}</p>
      </article>
    `).join("");

  document.getElementById("services-title").textContent=t.servicesTitle;
  document.getElementById("services-intro").textContent=t.servicesIntro;

  document.getElementById("service-cards").innerHTML=
    t.services.map(s=>`
      <article class="card">
        <h3>${s[0]}</h3>
        <p>${s[1]}</p>
        <div class="service-actions">
          <a href="${whatsappUrl(s[0])}" target="_blank" rel="noopener noreferrer">${t.actionWhatsapp}</a>
          <a href="tel:${CONTACT.phoneLink}">${t.actionPhone}</a>
          <a href="mailto:${CONTACT.email}">${t.actionEmail}</a>
        </div>
      </article>
    `).join("");

  document.getElementById("contact-title").textContent=t.contactTitle;
  document.getElementById("contact-intro").textContent=t.contactIntro;

  document.getElementById("contact-info").innerHTML=
    t.contact.map(c=>`
      <article class="contact-item">
        <h3>${c[0]}</h3>
        <p>${c[1]}</p>
      </article>
    `).join("");

  document.getElementById("contact-actions").innerHTML=`
    <a class="contact-icon" href="tel:${CONTACT.phoneLink}" aria-label="${t.contactCall}">
      ${icons.phone}
      <span>${t.contactCall}</span>
    </a>

    <a class="contact-icon" href="mailto:${CONTACT.email}" aria-label="${t.contactMail}">
      ${icons.email}
      <span>${t.contactMail}</span>
    </a>

    <a class="contact-icon whatsapp" href="${whatsappUrl(t.contactWhatsApp)}" target="_blank" rel="noopener noreferrer" aria-label="${t.contactWhatsApp}">
      ${icons.whatsapp}
      <span>${t.contactWhatsApp}</span>
    </a>
  `;

  document.getElementById("footer").textContent=t.footer;
}

document.getElementById("language").onclick=()=>{
  lang=lang==="fr"?"ar":"fr";
  render();
};

document.querySelectorAll("#navigation button").forEach(button=>{
  button.onclick=()=>{
    const page=button.dataset.page;

    document.querySelectorAll(".section").forEach(section=>{
      section.classList.remove("active");
    });

    document.getElementById(page).classList.add("active");

    document.querySelectorAll("#navigation button").forEach(b=>{
      b.classList.toggle("active",b.dataset.page===page);
    });

    window.scrollTo({top:0,behavior:"smooth"});
  };
});

render();
</script>

</body>
</html>
