
<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1426">
<title>WR Global Consulting Visa</title>

<style>
:root {
  --navy:#0b1426;
  --gold:#c9ad78;
  --light:#f1e8d8;
  --muted:#aeb8c7;
}

* {box-sizing:border-box}

body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at 50% 30%,
    #1b2c46 0%,#101d32 48%,#080f1d 100%);
  color:var(--light);
  font-family:Georgia,"Times New Roman",serif;
}

header {
  min-height:82px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #c9ad783b;
}

.brand {
  color:var(--gold);
  font-size:25px;
  letter-spacing:4px;
}

.brand small {
  display:block;
  font:10px Arial,sans-serif;
  letter-spacing:3px;
  margin-top:5px;
}

button {cursor:pointer;font:inherit}

.lang {
  background:transparent;
  color:var(--gold);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:9px 17px;
}

nav {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  padding:18px 5%;
  border-bottom:1px solid #c9ad7830;
}

nav button {
  background:transparent;
  border:1px solid transparent;
  color:var(--light);
  padding:12px 19px;
  transition:.2s;
}

nav button:hover,
nav button.active {
  color:var(--gold);
  border-color:#c9ad7870;
}

main {
  width:min(1050px,90%);
  margin:auto;
  padding:55px 0;
}

.hero {
  text-align:center;
  padding:55px 15px 65px;
}

.eyebrow {
  color:var(--gold);
  font:11px Arial,sans-serif;
  letter-spacing:4px;
  margin-bottom:20px;
}

h1 {
  font-size:clamp(28px,5vw,48px);
  font-weight:normal;
  letter-spacing:2px;
  margin:0;
}

.subtitle {
  color:var(--muted);
  font:12px Arial,sans-serif;
  letter-spacing:2px;
  margin:20px 0;
}

.hero-description {
  max-width:650px;
  margin:25px auto;
  line-height:1.9;
  color:var(--light);
}

.section {
  display:none;
  animation:appear .35s ease;
}

.section.active {display:block}

@keyframes appear {
  from {opacity:0;transform:translateY(8px)}
  to {opacity:1;transform:translateY(0)}
}

.section h2 {
  color:var(--gold);
  font-weight:normal;
  font-size:30px;
  text-align:center;
  margin-bottom:20px;
}

.intro {
  color:var(--muted);
  text-align:center;
  line-height:1.9;
  max-width:750px;
  margin:0 auto 35px;
}

.cards {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.card {
  background:#ffffff08;
  border:1px solid #c9ad7850;
  padding:24px 19px;
  min-height:160px;
  transition:.25s;
}

.card:hover {
  border-color:var(--gold);
  background:#c9ad7810;
  transform:translateY(-3px);
}

.card h3 {
  color:var(--gold);
  font-weight:normal;
  font-size:19px;
}

.card p {
  color:var(--muted);
  font-size:14px;
  line-height:1.8;
}

.values {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-top:35px;
}

.value {
  text-align:center;
  border-top:1px solid var(--gold);
  padding:15px 10px;
}

.value h3 {color:var(--gold);font-weight:normal}

.contact-info {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.contact-item {
  padding:20px;
  border:1px solid #c9ad7850;
  background:#ffffff08;
}

.contact-item h3 {
  color:var(--gold);
  font-weight:normal;
}

.contact-item p {
  color:var(--muted);
  line-height:1.7;
}

.signature {
  color:var(--gold);
  text-align:center;
  margin:45px auto 15px;
  font-style:italic;
  line-height:1.8;
}

footer {
  text-align:center;
  color:#9da8b8;
  font:10px Arial,sans-serif;
  letter-spacing:2px;
  padding:25px 10px;
  border-top:1px solid #c9ad7830;
}

[dir="rtl"] {
  font-family:Tahoma,Arial,sans-serif;
}

[dir="rtl"] .eyebrow,
[dir="rtl"] .subtitle {letter-spacing:1px}

[dir="rtl"] .brand {letter-spacing:1px}

@media(max-width:650px) {
  header {min-height:70px;padding:0 5%}
  .brand {font-size:20px;letter-spacing:2px}
  nav {gap:3px;padding:12px 3%}
  nav button {padding:10px;font-size:13px}
  main {padding:30px 0}
  .hero {padding:40px 10px}
  .cards {grid-template-columns:repeat(2,1fr);gap:10px}
  .card {padding:16px 12px}
  .card h3 {font-size:16px}
  .card p {font-size:13px}
  .values {grid-template-columns:1fr}
  .contact-info {grid-template-columns:1fr}
}

@media(max-width:360px) {
  .cards {grid-template-columns:1fr}
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none !important;
    transition:none !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    WR GLOBAL
    <small>CONSULTING VISA</small>
  </div>
  <button class="lang" id="language">العربية</button>
</header>

<nav id="navigation">
  <button data-page="home" class="active">Accueil</button>
  <button data-page="about">À propos</button>
  <button data-page="services">Nos services</button>
  <button data-page="contact">Contact</button>
</nav>

<main>

<section id="home" class="section active">
  <div class="hero">
    <p class="eyebrow" id="hero-label"></p>
    <h1 id="heading"></h1>
    <p class="subtitle" id="subtitle"></p>
    <p class="hero-description" id="hero-text"></p>
  </div>
  <div class="signature" id="signature"></div>
</section>

<section id="about" class="section">
  <h2 id="about-title"></h2>
  <p class="intro" id="about-intro"></p>
  <div class="values" id="values"></div>
</section>

<section id="services" class="section">
  <h2 id="services-title"></h2>
  <p class="intro" id="services-intro"></p>
  <div class="cards" id="service-cards"></div>
</section>

<section id="contact" class="section">
  <h2 id="contact-title"></h2>
  <p class="intro" id="contact-intro"></p>
  <div class="contact-info" id="contact-info"></div>
</section>

</main>

<footer id="footer"></footer>

<script>
const translations = {

fr: {
  toggle:"العربية",

  nav:["Accueil","À propos","Nos services","Contact"],

  heroLabel:"ASSISTANCE VOYAGE & VISA",
  heading:"UN MONDE D'OPPORTUNITÉS",
  subtitle:"EXPERTISE · CONSEIL · VISION INTERNATIONALE",

  heroText:"Nous préparons chaque étape de votre départ avec rigueur et discrétion.",

  signature:"Votre partenaire de confiance pour vos projets à l'international.",

  aboutTitle:"À propos de WR Global Consulting Visa",
  aboutIntro:"Installé à Ouled Belhadj, Saoula, WR Global Consulting Visa accompagne les particuliers, les familles et les professionnels dans leurs démarches de voyage et de visa. Notre approche repose sur l'écoute, la préparation rigoureuse et un accompagnement adapté à chaque projet.",

  values:[
    ["Écoute","Un interlocuteur attentif qui prend le temps de comprendre votre projet."],
    ["Rigueur","Une préparation soignée et une vérification attentive de vos dossiers."],
    ["Suivi","Un accompagnement personnalisé à chaque étape de votre démarche."]
  ],

  servicesTitle:"Nos services",
  servicesIntro:"De la préparation de votre dossier à l'organisation de votre départ, découvrez nos six domaines de services.",

  services:[
    ["RDV Visa","Prise de rendez-vous auprès des centres de dépôt et accompagnement jusqu'au jour de votre rendez-vous."],
    ["Formulaires","Remplissage soigné de vos formulaires de demande de visa, vérifiés avant chaque dépôt."],
    ["Réservation Hôtel","Réservations d'hôtel adaptées à votre séjour et aux exigences de votre dossier."],
    ["Billets d'Avion","Recherche et émission de billets d'avion selon vos dates et votre destination."],
    ["Assurance Voyage","Souscription d'une assurance voyage conforme aux exigences de votre demande."],
    ["Visa Électronique","Constitution et suivi de vos demandes de visa électronique, en ligne et sans déplacement."]
  ],

  contactTitle:"Contact",
  contactIntro:"Notre bureau vous accueille à Saoula pour échanger sur vos projets et étudier vos besoins.",

  contact:[
    ["Adresse","Ouled Belhadj, Saoula, Alger, Algérie"],
    ["Activité","Conseil et accompagnement dans les démarches internationales."]
  ],

  footer:"WR GLOBAL CONSULTING VISA · TOUS DROITS RÉSERVÉS"
},

ar: {
  toggle:"Français",

  nav:["الرئيسية","من نحن","خدماتنا","اتصل بنا"],

  heroLabel:"مساعدة في السفر والتأشيرات",
  heading:"عالم من الفرص",
  subtitle:"الخبرة · الاستشارة · الرؤية الدولية",

  heroText:"نحضّر كل مرحلة من سفركم بدقة وسرية.",

  signature:"شريككم الموثوق لمشاريعكم على الصعيد الدولي.",

  aboutTitle:"من نحن",
  aboutIntro:"من مقرنا بأولاد بلحاج، السحاولة، ترافق WR Global Consulting Visa الأفراد والعائلات والمهنيين في إجراءات السفر والتأشيرة. يعتمد نهجنا على الإصغاء والتحضير الدقيق والمرافقة المناسبة لكل مشروع.",

  values:[
    ["الإصغاء","محاور يهتم بفهم مشروعكم ويخصص الوقت للاستماع إليكم."],
    ["الدقة","تحضير متقن ومراجعة دقيقة لملفاتكم."],
    ["المتابعة","مرافقة شخصية في كل مرحلة من مراحل إجراءاتكم."]
  ],

  servicesTitle:"خدماتنا",
  servicesIntro:"من إعداد ملفكم إلى تنظيم سفركم، اكتشفوا مجالات خدماتنا الستة.",

  services:[
    ["موعد التأشيرة","حجز موعدكم لدى مراكز إيداع الملفات ومرافقتكم حتى يوم الموعد."],
    ["الاستمارات","ملء استمارات طلب التأشيرة بعناية ومراجعتها قبل كل إيداع."],
    ["حجز الفنادق","حجوزات فندقية تتناسب مع إقامتكم ومع متطلبات ملفكم."],
    ["تذاكر الطيران","البحث عن تذاكر الطيران وإصدارها حسب تواريخكم ووجهتكم."],
    ["تأمين السفر","اكتتاب تأمين سفر مطابق لمتطلبات طلبكم."],
    ["التأشيرة الإلكترونية","إعداد طلبات التأشيرة الإلكترونية ومتابعتها عبر الإنترنت دون عناء التنقل."]
  ],

  contactTitle:"اتصل بنا",
  contactIntro:"يسعدنا استقبالكم بمكتبنا في السحاولة للتحدث عن مشاريعكم ودراسة احتياجاتكم.",

  contact:[
    ["العنوان","أولاد بلحاج، السحاولة، الجزائر العاصمة، الجزائر"],
    ["النشاط","الاستشارات والمرافقة في الإجراءات الدولية."]
  ],

  footer:"WR GLOBAL CONSULTING VISA · جميع الحقوق محفوظة"
}

};

let lang="fr";

function render() {

 const t=translations[lang];

 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";

 document.getElementById("language").textContent=t.toggle;

 document.querySelectorAll("#navigation button").forEach((b,i)=>{
   b.textContent=t.nav[i];
 });

 document.getElementById("hero-label").textContent=t.heroLabel;
 document.getElementById("heading").textContent=t.heading;
 document.getElementById("subtitle").textContent=t.subtitle;
 document.getElementById("hero-text").textContent=t.heroText;
 document.getElementById("signature").textContent=t.signature;

 document.getElementById("about-title").textContent=t.aboutTitle;
 document.getElementById("about-intro").textContent=t.aboutIntro;

 document.getElementById("values").innerHTML=
   t.values.map(v=>`
    <article class="value">
      <h3>${v[0]}</h3>
      <p>${v[1]}</p>
    </article>
   `).join("");

 document.getElementById("services-title").textContent=t.servicesTitle;
 document.getElementById("services-intro").textContent=t.servicesIntro;

 document.getElementById("service-cards").innerHTML=
   t.services.map(s=>`
    <article class="card">
      <h3>${s[0]}</h3>
      <p>${s[1]}</p>
    </article>
   `).join("");

 document.getElementById("contact-title").textContent=t.contactTitle;
 document.getElementById("contact-intro").textContent=t.contactIntro;

 document.getElementById("contact-info").innerHTML=
   t.contact.map(c=>`
    <article class="contact-item">
      <h3>${c[0]}</h3>
      <p>${c[1]}</p>
    </article>
   `).join("");

 document.getElementById("footer").textContent=t.footer;
}

document.getElementById("language").onclick=()=>{
 lang=lang==="fr"?"ar":"fr";
 render();
};

document.querySelectorAll("#navigation button").forEach(button=>{
 button.onclick=()=>{
   const page=button.dataset.page;

   document.querySelectorAll(".section").forEach(section=>{
     section.classList.remove("active");
   });

   document.getElementById(page).classList.add("active");

   document.querySelectorAll("#navigation button").forEach(b=>{
     b.classList.remove("active");
   });

   button.classList.add("active");

   window.scrollTo({top:0,behavior:"smooth"});
 };
});

render();
</script>

</body>
</html>
